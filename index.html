<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>עץ משפחתי – לוי קזז</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bar: 54px;
  --c0: #b2f04a; --b0: #3a8010; --t0: #0a2000;
  --cR: #40e0d0; --bR: #007a70; --tR: #002a26;
  --c1: #ffd118; --b1: #9a6800; --t1: #2e1400;
  --c2: #ffe94a; --b2: #aa9000; --t2: #2e1c00;
  --c3: #ffba5c; --b3: #b86010; --t3: #2e1000;
  --c4: #ffa0cc; --b4: #b81868; --t4: #380018;
  --c5: #90c8ff; --b5: #2858b8; --t5: #001030;
  --c6: #88e8a8; --b6: #188840; --t6: #002010;
  --c7: #c8a8f8; --b7: #6028b8; --t7: #180038;
  --c8: #f8d0a0; --b8: #b86820; --t8: #2e1800;
}
html, body { height:100%; width:100%; overflow:hidden;
  font-family:'Frank Ruhl Libre','Arial Hebrew',Arial,sans-serif;
  background:#cde8a8; direction:rtl; }
#bar {
  position:fixed; top:0; left:0; right:0; height:var(--bar);
  background:linear-gradient(135deg,#0e2206,#1e4a0c,#0e2206);
  display:flex; align-items:center; justify-content:center;
  color:#c0f070; font-size:22px; font-weight:900; letter-spacing:1px;
  z-index:999; box-shadow:0 3px 18px rgba(0,0,0,.45);
}
#controls {
  position:fixed; bottom:18px; left:12px; z-index:999;
  display:flex; flex-direction:column; gap:8px;
}
.btn {
  width:46px; height:46px; border-radius:13px;
  background:#1a3808; color:#b8f060; border:2px solid #4a9018;
  font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.35); transition:background .1s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active { background:#2a5810; }
#srchbar {
  position:fixed; top:var(--bar); left:0; right:0;
  background:rgba(230,248,200,.97); border-bottom:2px solid #78b830;
  padding:8px 12px; z-index:998; display:flex; gap:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}
#srchbar input {
  flex:1; height:36px; padding:0 16px; border-radius:18px;
  border:2px solid #78b830; font-size:16px; font-family:inherit;
  direction:rtl; outline:none; background:white;
}
#srchbar input:focus { border-color:#2a7808; }
#srchbar button {
  width:36px; height:36px; border-radius:50%;
  background:#2a6010; color:#fff; border:none; font-size:16px; cursor:pointer;
}
#vp {
  position:fixed;
  top:calc(var(--bar) + 52px); left:0; right:0; bottom:0;
  overflow:auto; -webkit-overflow-scrolling:touch;
  cursor:grab;
}
#vp.dragging { cursor:grabbing; }
#canvas {
  position:relative;
  transform-origin:top center;
  display:inline-block;
  min-width:100%;
  padding:30px 40px 60px;
}
#lines {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  pointer-events:none; overflow:visible;
}
.card {
  position:absolute;
  border-radius:14px; border:3px solid;
  padding:10px 14px 9px;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(0,0,0,.18), 0 1px 5px rgba(0,0,0,.1);
  transition:box-shadow .15s, transform .1s, filter .1s;
  user-select:none; -webkit-tap-highlight-color:transparent;
  text-align:center;
  white-space:nowrap;
}
.card:active { transform:scale(.96); filter:brightness(.93); }
.card:hover { box-shadow:0 6px 24px rgba(0,0,0,.24), 0 2px 7px rgba(0,0,0,.12); }
.card .nm { font-size:15px; font-weight:700; line-height:1.3; white-space:normal; }
.card .dt {
  font-size:12px; font-weight:600;
  margin-top:5px; padding-top:5px;
  border-top:1px solid rgba(0,0,0,.12);
  opacity:.75; white-space:normal;
  letter-spacing:.3px;
}
.card .tog { font-size:18px; opacity:.4; margin-top:4px; transition:transform .25s; }
.card.open .tog { transform:rotate(180deg); opacity:.6; }
.d0{background:var(--c0);border-color:var(--b0);color:var(--t0);}
.d0 .nm{font-size:18px;}
.dR{background:var(--cR);border-color:var(--bR);color:var(--tR);border-width:4px;}
.dR .nm{font-size:18px;font-weight:900;}
.d1{background:var(--c1);border-color:var(--b1);color:var(--t1);}
.d2{background:var(--c2);border-color:var(--b2);color:var(--t2);}
.d3{background:var(--c3);border-color:var(--b3);color:var(--t3);}
.d4{background:var(--c4);border-color:var(--b4);color:var(--t4);}
.d5{background:var(--c5);border-color:var(--b5);color:var(--t5);}
.d6{background:var(--c6);border-color:var(--b6);color:var(--t6);}
.d7{background:var(--c7);border-color:var(--b7);color:var(--t7);}
.d8{background:var(--c8);border-color:var(--b8);color:var(--t8);}
.card.hl { outline:4px solid #ff5500; box-shadow:0 0 0 7px rgba(255,85,0,.2); }
#legbtn {
  position:fixed; bottom:18px; right:12px; z-index:999;
  width:46px; height:46px; border-radius:13px;
  background:#1a3808; color:#b8f060; border:2px solid #4a9018;
  font-size:20px; cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.35);
}
#legbox {
  position:fixed; bottom:72px; right:12px; z-index:999;
  background:white; border-radius:16px; padding:14px 16px;
  box-shadow:0 6px 28px rgba(0,0,0,.2); border:1.5px solid #ddd;
  display:none; font-size:13px;
}
#legbox.show { display:block; }
#legbox h3 { font-size:14px; margin-bottom:8px; border-bottom:1px solid #eee; padding-bottom:6px; font-weight:700; }
.lr { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.ls { width:22px; height:15px; border-radius:4px; border:2px solid; flex-shrink:0; }
</style>
</head>
<body>

<div id="bar">🌳 עץ משפחתי – לוי קזז</div>

<div id="srchbar">
  <input id="sinput" type="text" placeholder="🔍  חפש שם..." oninput="doSearch(this.value)">
  <button id="srch-nav" onclick="nextResult()" style="display:none; min-width:60px; height:36px; border-radius:18px; background:#2a6010; color:#fff; border:none; font-size:14px; cursor:pointer; padding:0 10px;"></button>
  <button onclick="sinput.value='';doSearch('')">✕</button>
</div>

<div id="vp">
  <div id="canvas">
    <svg id="lines"></svg>
  </div>
</div>

<div id="controls">
  <button class="btn" onclick="doZoom(1.2)">＋</button>
  <button class="btn" onclick="doZoom(0.83)">－</button>
  <button class="btn" onclick="resetView()">⟳</button>
</div>

<button id="legbtn" onclick="document.getElementById('legbox').classList.toggle('show')">🎨</button>
<div id="legbox">
  <h3>מקרא – צבע לפי דור</h3>
  <div class="lr"><div class="ls" style="background:#b2f04a;border-color:#3a8010"></div><span>דור 1 – חכם יוסף הרופא</span></div>
  <div class="lr"><div class="ls" style="background:#40e0d0;border-color:#007a70"></div><span>דור 2 – רבי יעקב</span></div>
  <div class="lr"><div class="ls" style="background:#ffd118;border-color:#9a6800"></div><span>דור 3</span></div>
  <div class="lr"><div class="ls" style="background:#ffe94a;border-color:#aa9000"></div><span>דור 4</span></div>
  <div class="lr"><div class="ls" style="background:#ffba5c;border-color:#b86010"></div><span>דור 5</span></div>
  <div class="lr"><div class="ls" style="background:#ffa0cc;border-color:#b81868"></div><span>דור 6</span></div>
  <div class="lr"><div class="ls" style="background:#90c8ff;border-color:#2858b8"></div><span>דור 7</span></div>
  <div class="lr"><div class="ls" style="background:#88e8a8;border-color:#188840"></div><span>דור 8</span></div>
  <div class="lr"><div class="ls" style="background:#c8a8f8;border-color:#6028b8"></div><span>דור 9</span></div>
</div>

<script>
const DATA = {nm:'', _root:true, ch:[
  {nm:'זכאי ⚭ עזיזה',_row:2,_cd:1,ch:[
    {nm:'חביבה',dt:'נישאה לעבדאללה לוי'},
  ]},
  {nm:'דינה ⚭ אליהו לוי',_row:2,_cd:1,ch:[
    {nm:'עבדאללה לוי ⚭ חביבה',dt:'חביבה – בת זכאי ועזיזה',ch:[
      {nm:'יעקב'},{nm:'אברהם'},{nm:'יחזקאל'},{nm:'זכאי'},
      {nm:'רימה'},{nm:"גורג'יה"},{nm:'לאה'},{nm:'דינה לוי',dt:'1910–1987'},
    ]},
  ]},
  {nm:'חכם יוסף הרופא',_row:0,_cd:0},
  {nm:'רבי יעקב ב"ר יוסף הרופא',dt:'1780–1851',_row:1},
  {nm:'אסתר ⚭ הרב הראשי\nמשה חיים שמאש',dt:'1836–1923',_row:2,_cd:1,ch:[
    {nm:'אליהו'},{nm:'יעקב'},{nm:'חביבה'},{nm:'כתון',dt:'נישאה ליחזקאל'},
  ]},
  {nm:'שמחה ⚭ חיו קזז',_row:2,_cd:1,ch:[
    {nm:'יחזקאל ⚭ כתון',dt:'כתון – בת אסתר',ch:[
      {nm:'עזרא ⚭ דינה לוי',dt:'1898–1962',ch:[
        {nm:'אלי קזז ⚭ מיקי',dt:'1943',ch:[
          {nm:'סימה',dt:'1973'},
          {nm:'ענת',dt:'1969'},
          {nm:'אסנת',dt:'1967',ch:[
            {nm:'נעה',dt:'1998'},{nm:'אלון',dt:'1994'},{nm:'עומר',dt:'1992'},
          ]},
        ]},
        {nm:'מוריס קזז',dt:'1934',ch:[
          {nm:'מוריס ⚭ שרה',_cd:4,ch:[
            {nm:'עופר עזרא ⚭ ציפי',dt:'1962',ch:[{nm:'שקד',dt:'1991'}]},
          ]},
          {nm:'מוריס ⚭ מרים',dt:'1935',_cd:4,ch:[
            {nm:'רועי קזז ⚭ אילונקה קאמנס',dt:'רועי: 1970 • אילונקה: 1966',ch:[
              {nm:'נועה',dt:'2005'},{nm:'תמר',dt:'2003'},
            ]},
            {nm:'טלי קזז ⚭ יוסי אלמלם',dt:'טלי: 1967 • יוסי: 1966',ch:[
              {nm:'מעין אלמלם',dt:'2005'},
              {nm:'רותם ⚭ מתן קצב',dt:'1997',ch:[{nm:'ליבי',dt:'2026'}]},
              {nm:'אשכר ⚭ אופיר בנר',dt:'1994',ch:[
                {nm:'אלמה',dt:'2025'},{nm:'ארי',dt:'2023'},
              ]},
            ]},
          ]},
        ]},
        {nm:'ברטה ⚭ יצחק סעאת',dt:'1934',ch:[
          {nm:'עזרא ⚭ רחל-לי',dt:'עזרא: 1965 • רחל-לי: 1970',ch:[
            {nm:'יעל',dt:'2006'},{nm:'יובל',dt:'2003'},{nm:'עודד',dt:'2000'},{nm:'דנה',dt:'1997'},
          ]},
          {nm:'יעקב (קובי) סער',dt:'1960',ch:[
            {nm:'אורי',dt:'2000'},
            {nm:'נוי סער ⚭ אדר מזרחי',dt:'1991',ch:[{nm:'תומר',dt:'2026'}]},
            {nm:'דור סער-מן ⚭ אלכס',dt:'1988',ch:[
              {nm:'נעמי',dt:'2022'},{nm:'רום',dt:'2019'},
            ]},
          ]},
          {nm:'אורנה',dt:'1958',ch:[
            {nm:'שחר ⚭ ליז',dt:'1988',ch:[
              {nm:'ברי',dt:'2021'},{nm:'גיא',dt:'2019'},
            ]},
            {nm:'מיכל ⚭ רועי',dt:'1985',ch:[
              {nm:'מיקה',dt:'2017'},{nm:'יובל',dt:'2013'},{nm:'גילי',dt:'2010'},
            ]},
            {nm:"אמיר ⚭ ג'ני",dt:'1983',ch:[
              {nm:'עומר',dt:'2021'},{nm:'אלון',dt:'2017'},{nm:'עידן',dt:'2014'},
            ]},
          ]},
        ]},
        {nm:'לואיז ⚭ דוד קזז',dt:'1931–2012',ch:[
          {nm:"ג'רי",dt:'1959'},
          {nm:"ג'פרי",dt:'1958',ch:[
            {nm:"זואי ⚭ דן"},{nm:'שרה ⚭ אריק'},
          ]},
          {nm:'עמוס',dt:'1955',ch:[
            {nm:'טליה'},
            {nm:'שירה',ch:[{nm:'איב'},{nm:'גבי'}]},
          ]},
          {nm:'דני',dt:'1952',ch:[
            {nm:'זאק'},
            {nm:"ג'רמי"},
            {nm:'רבקה ⚭ דרור אלחסיד',ch:[
              {nm:'סופי',dt:'2016'},{nm:'קרן',dt:'2013'},{nm:'איתן',dt:'2010'},
            ]},
          ]},
        ]},
        {nm:'יחזקאל קזז ⚭ חנה',dt:'1929–1979'},
        {nm:'עבדולנבי לוי ⚭ כתון',dt:'1905–1990',ch:[
          {nm:'חזי ⚭ רונית',dt:'חזי: 1956 • רונית: 1959',ch:[
            {nm:'אלדד ⚭ אנה',dt:'אלדד: 1985 • אנה: 1988',ch:[{nm:'עמליה',dt:'2023'}]},
            {nm:'תומר ⚭ רוני',dt:'תומר: 1982 • רוני: 1983',ch:[
              {nm:'עופרי',dt:'2018'},{nm:'אמילי',dt:'2012'},{nm:'איתן',dt:'2012'},
            ]},
          ]},
          {nm:'דליה ⚭ שאול מזור',dt:'דליה: 1951 • שאול: 1949',ch:[
            {nm:'רועי ⚭ מיכל',ch:[{nm:'עידן'},{nm:'שירה'},{nm:'טל'}]},
            {nm:'אלעד ⚭ איריס',ch:[{nm:'לירון'},{nm:'עמית'},{nm:'רותם'}]},
            {nm:'לימור',ch:[{nm:'דניאל'}]},
          ]},
          {nm:'שאול לוי ז"ל ⚭ דובה',dt:'שאול: 1948–1973 • דובה: 1947–2002',ch:[
            {nm:'יניב ⚭ אביגיל',dt:'יניב: 1973 • אביגיל: 1978',ch:[
              {nm:'אור קשת',dt:'2007 • מנישואים ראשונים עם סמדר'},
              {nm:'מורי',dt:'2016'},{nm:'עמנואל',dt:'2016'},
            ]},
            {nm:'תדהר',dt:'1970–2025'},
          ]},
          {nm:'עדה ⚭ יאיר',dt:'עדה: 1946 • יאיר: 1947',ch:[
            {nm:'נטע ⚭ אורן',ch:[{nm:'רז'},{nm:'עומר'}]},
            {nm:'מרב ⚭ יניב',ch:[{nm:'נבו'},{nm:'רומי'}]},
            {nm:'ליאור ⚭ ורד',ch:[{nm:'עדי'},{nm:'שי'},{nm:'ליהי'}]},
          ]},
        ]},
      ]},
      {nm:'סמרה'},{nm:"רג'ינה"},{nm:'מוזלי',dt:'נישאה לסלמאן'},
    ]},
    {nm:'סלמאן ⚭ מוזלי',dt:'מוזלי – בת יחזקאל וכתון',ch:[
      {nm:'כתון'},{nm:'חיים'},{nm:'דוד ⚭ לואיז',dt:'1923'},
    ]},
    {nm:'עבדאללה'},{nm:'יצחק'},
    {nm:'מעתוקה'},{nm:'עזיזה'},{nm:"צ'חלה"},
  ]},
]};

const NW = 160, NH = 70, HGAP = 16, VGAP = 80;
const DCLS = ['d0','d1','d2','d3','d4','d5','d6','d7','d8'];
function dc(d){ return DCLS[Math.min(d,8)]; }

function subtreeW(n) {
  if (n._root) {
    const row2 = n.ch.filter(c => c._row === 2);
    return row2.reduce((s,c) => s + subtreeW(c), 0) + HGAP * Math.max(0, row2.length - 1);
  }
  if (!n._open || !n.ch || !n.ch.length) return NW;
  const total = n.ch.reduce((s,c) => s + subtreeW(c), 0) + HGAP * (n.ch.length - 1);
  return Math.max(NW, total);
}

function layout(n, x, y) {
  if (n._root) {
    n._y = -9999; n._x = -9999;
    const row0 = n.ch.filter(c => c._row === 0);
    const row1 = n.ch.filter(c => c._row === 1);
    const row2 = n.ch.filter(c => c._row === 2);
    const row2W = row2.reduce((s,c) => s + subtreeW(c), 0) + HGAP * Math.max(0, row2.length - 1);
    // שורה 2
    let cx = x;
    for (const c of row2) {
      c._w = subtreeW(c);
      layout(c, cx, y + (NH + VGAP) * 2);
      cx += c._w + HGAP;
    }
    // שורה 1 (רבי יעקב) - ממורכז מעל שורה 2
    const r1W = row1.reduce((s,c) => s + subtreeW(c), 0) + HGAP * Math.max(0, row1.length-1);
    let rx = x + row2W/2 - r1W/2;
    for (const c of row1) {
      c._w = subtreeW(c);
      layout(c, rx, y + NH + VGAP);
      rx += c._w + HGAP;
    }
    // שורה 0 (חכם יוסף) - ממורכז מעל שורה 1
    const r0W = row0.reduce((s,c) => s + subtreeW(c), 0) + HGAP * Math.max(0, row0.length-1);
    let r0x = x + row2W/2 - r0W/2;
    for (const c of row0) {
      c._w = subtreeW(c);
      layout(c, r0x, y);
      r0x += c._w + HGAP;
    }
    return;
  }
  n._y = y; n._w = subtreeW(n); n._x = x + (n._w - NW) / 2;
  if (n._open && n.ch && n.ch.length) {
    let cx = x;
    for (const c of n.ch) {
      c._w = subtreeW(c);
      layout(c, cx, y + NH + VGAP);
      cx += c._w + HGAP;
    }
  }
}

function visible(n, arr=[]) {
  if (!n._root) arr.push(n);
  if ((n._open || n._root) && n.ch) n.ch.forEach(c => visible(c, arr));
  return arr;
}

const ALL = [];
function gatherAll(n){ if(!n._root) ALL.push(n); if(n.ch) n.ch.forEach(c=>gatherAll(c)); }
gatherAll(DATA);

ALL.forEach(n => { n._open = false; n._depth = 0; });
function setDepth(n,d){
  if(!n._root) n._depth = n._cd !== undefined ? n._cd : d;
  if(n.ch) n.ch.forEach(c=>setDepth(c, n._root ? 0 : (n._cd !== undefined ? n._cd : d)+1));
}
setDepth(DATA, 0);
DATA._open = true;

const canvas = document.getElementById('canvas');
const svgEl  = document.getElementById('lines');
const XPAD = 20;

function render() {
  layout(DATA, XPAD, 0);
  const nodes = visible(DATA);
  const maxX = Math.max(...nodes.map(n => n._x + NW)) + XPAD;
  const maxY = Math.max(...nodes.map(n => n._y + NH)) + 60;
  canvas.style.width  = maxX + 'px';
  canvas.style.height = maxY + 'px';
  svgEl.setAttribute('width', maxX);
  svgEl.setAttribute('height', maxY);

  nodes.forEach(n => {
    if (!n._el) {
      const el = document.createElement('div');
      const isRabbi = n.nm && n.nm.includes('רבי יעקב');
      const isYechezkel = n.nm && n.nm.includes('יחזקאל קזז ⚭ חנה');
      const isShaul = n.nm && n.nm.includes('שאול לוי ז"ל ⚭ דובה');
      el.className = 'card ' + (isRabbi ? 'dR' : dc(n._cd !== undefined ? n._cd : n._depth));
      const hasCh = n.ch && n.ch.length;
      const wikiBtn = isRabbi
        ? '<a href="https://he.wikipedia.org/wiki/%D7%99%D7%A2%D7%A7%D7%91_%D7%91%D7%A8_%D7%99%D7%95%D7%A1%D7%A3_%D7%94%D7%A8%D7%95%D7%A4%D7%90" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;font-size:11px;color:#007a70;text-decoration:none;border:1px solid #007a70;border-radius:8px;padding:2px 8px;cursor:pointer;">📖 ויקיפדיה</a>'
        : isYechezkel
        ? '<a href="https://he.wikipedia.org/wiki/%D7%99%D7%97%D7%96%D7%A7%D7%90%D7%9C_%D7%A7%D7%96%D7%96" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;font-size:11px;color:#1858b8;text-decoration:none;border:1px solid #1858b8;border-radius:8px;padding:2px 8px;cursor:pointer;">📖 ויקיפדיה</a>'
        : isShaul
        ? '<a href="https://he.wikipedia.org/wiki/%D7%A9%D7%90%D7%95%D7%9C_%D7%9C%D7%95%D7%99" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;font-size:11px;color:#1858b8;text-decoration:none;border:1px solid #1858b8;border-radius:8px;padding:2px 8px;cursor:pointer;">📖 ויקיפדיה</a>'
        : '';
      el.innerHTML =
        '<div class="nm">' + n.nm.replace(/\n/g,'<br>') + '</div>' +
        (n.dt ? '<div class="dt">'+n.dt+'</div>' : '') +
        wikiBtn +
        (hasCh ? '<div class="tog">▼</div>' : '');
      el.style.width = NW + 'px';
      if (n._open) el.classList.add('open');
      el.addEventListener('click', (e) => {
        if (e.target.tagName === 'A') return; // אל תטפל בלחיצה על קישור
        if (!n.ch || !n.ch.length) return;
        const vpRect = vp.getBoundingClientRect();
        n._open = !n._open;
        render();
        requestAnimationFrame(() => {
          const newRect = el.getBoundingClientRect();
          vp.scrollLeft += (newRect.left + newRect.width/2) - vpRect.left - vpRect.width/2;
          vp.scrollTop  += (newRect.top  + newRect.height/2) - vpRect.top  - vpRect.height/2;
        });
      });
      n._el = el;
      canvas.appendChild(el);
    }
    n._el.style.left = n._x + 'px';
    n._el.style.top  = n._y + 'px';
    n._el.style.display = 'block';
    n._el.classList.toggle('open', n._open);
    // עדכן צבע אם יש _cd
    const isRabbi = n.nm && n.nm.includes('רבי יעקב');
    const colorClass = isRabbi ? 'dR' : dc(n._cd !== undefined ? n._cd : n._depth);
    n._el.className = 'card ' + colorClass + (n._open ? ' open' : '') + (n._el.classList.contains('hl') ? ' hl' : '');
  });

  ALL.forEach(n => { if (n._el && !nodes.includes(n)) n._el.style.display = 'none'; });
  drawLines(nodes);
}

function drawLines(nodes) {
  const LC = '#5a9028';
  let p = '';
  nodes.forEach(n => {
    if (!n._open || !n.ch || !n.ch.length) return;
    const px = n._x + NW/2, py = n._y + NH, my = py + VGAP * 0.45;
    const vis = n.ch.filter(c => nodes.includes(c));
    if (!vis.length) return;
    p += `<line x1="${px}" y1="${py}" x2="${px}" y2="${my}" stroke="${LC}" stroke-width="3" stroke-linecap="round"/>`;
    if (vis.length === 1) {
      const k = vis[0], kx = k._x + NW/2;
      p += `<line x1="${px}" y1="${my}" x2="${kx}" y2="${my}" stroke="${LC}" stroke-width="3"/>`;
      p += `<line x1="${kx}" y1="${my}" x2="${kx}" y2="${k._y}" stroke="${LC}" stroke-width="3" stroke-linecap="round"/>`;
    } else {
      const xs = vis.map(k => k._x + NW/2);
      p += `<line x1="${Math.min(...xs)}" y1="${my}" x2="${Math.max(...xs)}" y2="${my}" stroke="${LC}" stroke-width="3"/>`;
      vis.forEach(k => {
        const kx = k._x + NW/2;
        p += `<line x1="${kx}" y1="${my}" x2="${kx}" y2="${k._y}" stroke="${LC}" stroke-width="3" stroke-linecap="round"/>`;
      });
    }
  });
  svgEl.innerHTML = p;

  // קו ישיר בין חכם יוסף לרבי יעקב
  const yosef = ALL.find(n => n.nm && n.nm.includes('חכם יוסף'));
  const rabbiNode = ALL.find(n => n.nm && n.nm.includes('רבי יעקב'));
  if (yosef && rabbiNode && yosef._el && rabbiNode._el &&
      yosef._el.style.display !== 'none' && rabbiNode._el.style.display !== 'none') {
    const x1 = yosef._x + NW/2, y1 = yosef._y + NH;
    const x2 = rabbiNode._x + NW/2, y2 = rabbiNode._y;
    svgEl.innerHTML += `<line x1="${x1}" y1="${y1 - 3}" x2="${x2}" y2="${y2 + 30}" stroke="#5a9028" stroke-width="3" stroke-linecap="round"/>`;
  }

  // קו ישיר בין רבי יעקב לאסתר
  const rabbi = ALL.find(n => n.nm && n.nm.includes('רבי יעקב'));
  const esther = ALL.find(n => n.nm && n.nm.includes('אסתר ⚭ הרב'));
  if (rabbi && esther && rabbi._el && esther._el &&
      rabbi._el.style.display !== 'none' && esther._el.style.display !== 'none') {
    const x1 = rabbi._x + NW/2, y1 = rabbi._y + NH;
    const x2 = esther._x + NW/2, y2 = esther._y;
    const mid = y1 + (y2 - y1) * 0.5;
    svgEl.innerHTML += `<path d="M${x1},${y1} L${x1},${mid} L${x2},${mid} L${x2},${y2}" fill="none" stroke="#5a9028" stroke-width="3" stroke-linecap="round"/>`;
  }

  function dashedElbow(x1, y1, x2, y2, label) {
    const mid = Math.max(y1, y2) + 40;
    const lx = (x1 + x2) / 2, ly = mid - 6;
    return `<path d="M${x1},${y1} L${x1},${mid} L${x2},${mid} L${x2},${y2}" fill="none" stroke="#b86010" stroke-width="2.5" stroke-dasharray="8,5" opacity="0.85"/>` +
      (label ? `<rect x="${lx - label.length*4.5}" y="${ly - 13}" width="${label.length*9}" height="16" rx="4" fill="white" opacity="0.85"/>
      <text x="${lx}" y="${ly}" text-anchor="middle" font-size="11" fill="#b86010" font-weight="700" font-family="Arial Hebrew, Arial">${label}</text>` : '');
  }

  // קו מקווקוו בין דינה לוי (בת עבדאללה) לעזרא (בן יחזקאל)
  const dinaLevi = ALL.find(n => n.nm === 'דינה לוי' && n.dt && n.dt.includes('1910'));
  const ezra = ALL.find(n => n.nm && n.nm.includes('עזרא ⚭ דינה לוי'));
  if (dinaLevi && ezra && dinaLevi._el && ezra._el &&
      dinaLevi._el.style.display !== 'none' && ezra._el.style.display !== 'none') {
    svgEl.innerHTML += dashedElbow(dinaLevi._x + NW/2, dinaLevi._y + NH, ezra._x + NW/2, ezra._y, 'דינה לוי ⚭ עזרא');
  }

  // קו מקווקוו בין חביבה (בת זכאי) לעבדאללה לוי
  const chaviva = ALL.find(n => n.nm === 'חביבה' && n.dt && n.dt.includes('נישאה לעבדאללה'));
  const avdalla = ALL.find(n => n.nm && n.nm.includes('עבדאללה לוי ⚭ חביבה'));
  if (chaviva && avdalla && chaviva._el && avdalla._el &&
      chaviva._el.style.display !== 'none' && avdalla._el.style.display !== 'none') {
    svgEl.innerHTML += dashedElbow(chaviva._x + NW/2, chaviva._y + NH, avdalla._x + NW/2, avdalla._y, 'חביבה ⚭ עבדאללה לוי');
  }

  // קו מקווקוו בין כתון (בת אסתר) ליחזקאל ⚭ כתון (בן שמחה)
  const katon = ALL.find(n => n.nm === 'כתון' && n.dt && n.dt.includes('נישאה ליחזקאל'));
  const yechezkel = ALL.find(n => n.nm && n.nm.includes('יחזקאל ⚭ כתון'));
  if (katon && yechezkel && katon._el && yechezkel._el &&
      katon._el.style.display !== 'none' && yechezkel._el.style.display !== 'none') {
    svgEl.innerHTML += dashedElbow(katon._x + NW/2, katon._y + NH, yechezkel._x + NW/2, yechezkel._y, 'כתון ⚭ יחזקאל');
  }
  // קו מקווקוו בין מוזלי (בת יחזקאל) לסלמאן (בן שמחה)
  const mozli = ALL.find(n => n.nm === 'מוזלי' && n.dt && n.dt.includes('נישאה לסלמאן'));
  const salman = ALL.find(n => n.nm && n.nm.includes('סלמאן ⚭ מוזלי'));
  if (mozli && salman && mozli._el && salman._el &&
      mozli._el.style.display !== 'none' && salman._el.style.display !== 'none') {
    svgEl.innerHTML += dashedElbow(mozli._x + NW/2, mozli._y + NH, salman._x + NW/2, salman._y, 'מוזלי ⚭ סלמאן');
  }

  // קו מקווקוו בין לואיז (בת עזרא) לדוד (בן סלמאן)
  const louiz = ALL.find(n => n.nm && n.nm.includes('לואיז ⚭ דוד קזז'));
  const david = ALL.find(n => n.nm && n.nm.includes('דוד ⚭ לואיז'));
  if (louiz && david && louiz._el && david._el &&
      louiz._el.style.display !== 'none' && david._el.style.display !== 'none') {
    svgEl.innerHTML += dashedElbow(louiz._x + NW/2, louiz._y + NH, david._x + NW/2, david._y, 'לואיז ⚭ דוד');
  }
}

let scale = 1;
const vp = document.getElementById('vp');
render();
setTimeout(centerOnRoot, 60);

function doZoom(f) {
  scale = Math.min(3, Math.max(0.15, scale * f));
  canvas.style.transform = `scale(${scale})`;
  canvas.style.transformOrigin = 'top center';
}
function centerOnRoot() {
  const target = ALL.find(n => n.nm && n.nm.includes('רבי יעקב'));
  const el = target && target._el;
  if (!el) return;
  requestAnimationFrame(() => {
    const vpRect = vp.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    vp.scrollLeft += elRect.left + elRect.width/2 - vpRect.left - vpRect.width/2;
  });
}
function resetView() {
  scale = 1;
  canvas.style.transform = '';
  ALL.forEach(n => { n._open = false; if (n._el) { n._el.remove(); n._el = null; } });
  render();
  setTimeout(centerOnRoot, 80);
}

// mouse drag
let isDragging = false, dragX = 0, dragY = 0, dragMoved = false;
vp.addEventListener('mousedown', e => {
  if (e.target.closest('.card')) return; // אל תתחיל גרירה על כרטיס
  isDragging = true; dragMoved = false;
  dragX = e.clientX; dragY = e.clientY;
  vp.classList.add('dragging');
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - dragX, dy = e.clientY - dragY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
  vp.scrollLeft -= dx; vp.scrollTop -= dy;
  dragX = e.clientX; dragY = e.clientY;
});
window.addEventListener('mouseup', e => {
  if (dragMoved) e.stopPropagation();
  isDragging = false; vp.classList.remove('dragging');
}, true);

// touch pinch zoom
let lastDist = 0;
vp.addEventListener('touchstart', e => {
  if (e.touches.length === 2)
    lastDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
}, {passive:true});
vp.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    doZoom(d / lastDist); lastDist = d;
  }
}, {passive:true});

let srchResults = [], srchIdx = 0;

function updateNavBtn() {
  const btn = document.getElementById('srch-nav');
  if (srchResults.length > 1) {
    btn.style.display = 'block';
    btn.textContent = (srchIdx + 1) + '/' + srchResults.length + ' ›';
  } else {
    btn.style.display = 'none';
  }
}

function jumpTo(n) {
  openPath(n); render();
  setTimeout(() => {
    if (n._el) {
      n._el.classList.add('hl');
      n._el.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }, 80);
}

function nextResult() {
  if (!srchResults.length) return;
  srchIdx = (srchIdx + 1) % srchResults.length;
  ALL.forEach(n => n._el && n._el.classList.remove('hl'));
  const n = srchResults[srchIdx];
  if (!n) return;
  openPath(n); render();
  setTimeout(() => {
    srchResults.forEach(r => { if (r._el) r._el.classList.add('hl'); });
    if (n._el) n._el.scrollIntoView({behavior:'smooth', block:'center'});
    updateNavBtn();
  }, 120);
}

function openPath(target) {
  function dig(n) {
    if (n === target) return true;
    if (!n.ch) return false;
    for (const c of n.ch) { if (dig(c)) { if(!n._root) n._open = true; return true; } }
  }
  dig(DATA);
}

function doSearch(q) {
  ALL.forEach(n => n._el && n._el.classList.remove('hl'));
  srchResults = [];
  srchIdx = 0;
  const btn = document.getElementById('srch-nav');
  btn.style.display = 'none';
  if (!q.trim()) return;
  srchResults = ALL.filter(n => n.nm.includes(q)||(n.dt||'').includes(q));
  if (!srchResults.length) return;
  srchResults.forEach(n => openPath(n));
  render();
  setTimeout(() => {
    srchResults.forEach(n => { if (n._el) n._el.classList.add('hl'); });
    const first = srchResults[0];
    if (first && first._el) first._el.scrollIntoView({behavior:'smooth', block:'center'});
    updateNavBtn();
  }, 120);
}
document.addEventListener('click', e => {
  if (!e.target.closest('#legbox') && !e.target.closest('#legbtn'))
    document.getElementById('legbox').classList.remove('show');
});
</script>
