<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>עץ משפחתי – לוי קזז</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bar: 54px;
  --c0: #b2f04a; --b0: #3a8010; --t0: #0a2000;
  --c1: #ffd118; --b1: #9a6800; --t1: #2e1400;
  --c2: #ffe94a; --b2: #aa9000; --t2: #2e1c00;
  --c3: #ffba5c; --b3: #b86010; --t3: #2e1000;
  --c4: #ffa0cc; --b4: #b81868; --t4: #380018;
  --c5: #90c8ff; --b5: #2858b8; --t5: #001030;
  --c6: #88e8a8; --b6: #188840; --t6: #002010;
  --c7: #c8a8f8; --b7: #6028b8; --t7: #180038;
}
html, body { height:100%; width:100%; overflow:hidden;
  font-family:'Frank Ruhl Libre','Arial Hebrew',Arial,sans-serif;
  background:#cde8a8; direction:rtl; }
#bar {
  position:fixed; top:0; left:0; right:0; height:var(--bar);
  background:linear-gradient(135deg,#0e2206,#1e4a0c,#0e2206);
  display:flex; align-items:center; justify-content:center;
  color:#c0f070; font-size:22px; font-weight:900; letter-spacing:1px;
  z-index:999; box-shadow:0 3px 18px rgba(0,0,0,.45);
}
#controls {
  position:fixed; bottom:18px; left:12px; z-index:999;
  display:flex; flex-direction:column; gap:8px;
}
.btn {
  width:46px; height:46px; border-radius:13px;
  background:#1a3808; color:#b8f060; border:2px solid #4a9018;
  font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.35); transition:background .1s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active { background:#2a5810; }
#srchbar {
  position:fixed; top:var(--bar); left:0; right:0;
  background:rgba(230,248,200,.97); border-bottom:2px solid #78b830;
  padding:8px 12px; z-index:998; display:flex; gap:8px;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}
#srchbar input {
  flex:1; height:36px; padding:0 16px; border-radius:18px;
  border:2px solid #78b830; font-size:16px; font-family:inherit;
  direction:rtl; outline:none; background:white;
}
#srchbar input:focus { border-color:#2a7808; }
#srchbar button {
  width:36px; height:36px; border-radius:50%;
  background:#2a6010; color:#fff; border:none; font-size:16px; cursor:pointer;
}
#vp {
  position:fixed;
  top:calc(var(--bar) + 52px); left:0; right:0; bottom:0;
  overflow:auto; -webkit-overflow-scrolling:touch;
  cursor:grab;
}
#vp.dragging { cursor:grabbing; }
#canvas {
  position:relative;
  transform-origin:top center;
  display:inline-block;
  min-width:100%;
  padding:30px 40px 60px;
}
#lines {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  pointer-events:none; overflow:visible;
}
.card {
  position:absolute;
  border-radius:14px; border:3px solid;
  padding:10px 14px 9px;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(0,0,0,.18), 0 1px 5px rgba(0,0,0,.1);
  transition:box-shadow .15s, transform .1s, filter .1s;
  user-select:none; -webkit-tap-highlight-color:transparent;
  text-align:center;
  white-space:nowrap;
}
.card:active { transform:scale(.96); filter:brightness(.93); }
.card:hover { box-shadow:0 6px 24px rgba(0,0,0,.24), 0 2px 7px rgba(0,0,0,.12); }
.card .nm { font-size:15px; font-weight:700; line-height:1.3; white-space:normal; }
.card .dt {
  font-size:12px; font-weight:600;
  margin-top:5px; padding-top:5px;
  border-top:1px solid rgba(0,0,0,.12);
  opacity:.75; white-space:normal;
  letter-spacing:.3px;
}
.card .tog { font-size:18px; opacity:.4; margin-top:4px; transition:transform .25s; }
.card.open .tog { transform:rotate(180deg); opacity:.6; }
.d0{background:var(--c0);border-color:var(--b0);color:var(--t0);}
.d0 .nm{font-size:18px;}
.d1{background:var(--c1);border-color:var(--b1);color:var(--t1);}
.d2{background:var(--c2);border-color:var(--b2);color:var(--t2);}
.d3{background:var(--c3);border-color:var(--b3);color:var(--t3);}
.d4{background:var(--c4);border-color:var(--b4);color:var(--t4);}
.d5{background:var(--c5);border-color:var(--b5);color:var(--t5);}
.d6{background:var(--c6);border-color:var(--b6);color:var(--t6);}
.d7{background:var(--c7);border-color:var(--b7);color:var(--t7);}
.card.hl { outline:4px solid #ff5500; box-shadow:0 0 0 7px rgba(255,85,0,.2); }
#legbtn {
  position:fixed; bottom:18px; right:12px; z-index:999;
  width:46px; height:46px; border-radius:13px;
  background:#1a3808; color:#b8f060; border:2px solid #4a9018;
  font-size:20px; cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.35);
}
#legbox {
  position:fixed; bottom:72px; right:12px; z-index:999;
  background:white; border-radius:16px; padding:14px 16px;
  box-shadow:0 6px 28px rgba(0,0,0,.2); border:1.5px solid #ddd;
  display:none; font-size:13px;
}
#legbox.show { display:block; }
#legbox h3 { font-size:14px; margin-bottom:8px; border-bottom:1px solid #eee; padding-bottom:6px; font-weight:700; }
.lr { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.ls { width:22px; height:15px; border-radius:4px; border:2px solid; flex-shrink:0; }
</style>
</head>
<body>

<div id="bar">🌳 עץ משפחתי – לוי קזז</div>

<div id="srchbar">
  <input id="sinput" type="text" placeholder="🔍  חפש שם..." oninput="doSearch(this.value)">
  <button onclick="sinput.value='';doSearch('')">✕</button>
</div>

<div id="vp">
  <div id="canvas">
    <svg id="lines"></svg>
  </div>
</div>

<div id="controls">
  <button class="btn" onclick="doZoom(1.2)">＋</button>
  <button class="btn" onclick="doZoom(0.83)">－</button>
  <button class="btn" onclick="resetView()">⟳</button>
</div>

<button id="legbtn" onclick="document.getElementById('legbox').classList.toggle('show')">🎨</button>
<div id="legbox">
  <h3>מקרא – צבע לפי דור</h3>
  <div class="lr"><div class="ls" style="background:#b2f04a;border-color:#3a8010"></div><span>דור 1 – אבי המשפחה</span></div>
  <div class="lr"><div class="ls" style="background:#ffd118;border-color:#9a6800"></div><span>דור 2</span></div>
  <div class="lr"><div class="ls" style="background:#ffe94a;border-color:#aa9000"></div><span>דור 3</span></div>
  <div class="lr"><div class="ls" style="background:#ffba5c;border-color:#b86010"></div><span>דור 4</span></div>
  <div class="lr"><div class="ls" style="background:#ffa0cc;border-color:#b81868"></div><span>דור 5</span></div>
  <div class="lr"><div class="ls" style="background:#90c8ff;border-color:#2858b8"></div><span>דור 6</span></div>
  <div class="lr"><div class="ls" style="background:#88e8a8;border-color:#188840"></div><span>דור 7</span></div>
  <div class="lr"><div class="ls" style="background:#c8a8f8;border-color:#6028b8"></div><span>דור 8</span></div>
</div>

<script>
const DATA = {nm:'רבי יעקב ב"ר יוסף הרופא',dt:'נפטר ב-1851',ch:[
  {nm:'זכאי ⚭ עזיזה',ch:[
    {nm:'חביבה',dt:'נישאה לעבדאללה לוי'},
  ]},
  {nm:'דינה ⚭ אליהו לוי',ch:[
    {nm:'עבדאללה לוי ⚭ חביבה',dt:'חביבה – בת זכאי ועזיזה',ch:[
      {nm:'יעקב'},{nm:'אברהם'},{nm:'יחזקאל'},{nm:'זכאי'},
      {nm:'רימה'},{nm:"גורג'יה"},{nm:'לאה'},{nm:'דינה לוי',dt:'1910–1987'},
    ]},
  ]},
  {nm:'אסתר ⚭ הרב הראשי\nמשה חיים שמאש',dt:'1836–1923',ch:[
    {nm:'כתון',dt:'נישאה ליחזקאל'},{nm:'חביבה'},{nm:'יעקב'},{nm:'אליהו'},
  ]},
  {nm:'שמחה ⚭ חיו קזז',ch:[
    {nm:'יחזקאל ⚭ כתון',dt:'כתון – בת אסתר',ch:[
      {nm:'עזרא ⚭ דינה לוי',dt:'1898–1962',ch:[
        {nm:'לואיז',dt:'1931–2012',ch:[
          {nm:'דני',dt:'1952',ch:[
            {nm:'רבקה ⚭ דרור אלחסיד',ch:[
              {nm:'איתן',dt:'2010'},{nm:'קרן',dt:'2013'},{nm:'סופי',dt:'2016'},
            ]},
            {nm:"ג'רמי"},{nm:'זאק'},
          ]},
          {nm:'עמוס',dt:'1955',ch:[
            {nm:'טליה'},
            {nm:'שירה',ch:[
              {nm:'איב'},{nm:'גבי'},
            ]},
          ]},
          {nm:"ג'פרי",dt:'1958',ch:[
            {nm:"זואי ⚭ דן"},{nm:'שרה ⚭ אריק'},
          ]},
          {nm:"ג'רי",dt:'1959'},
        ]},
        {nm:'ברטה ⚭ יצחק סעאת',dt:'1934',ch:[
          {nm:'אורנה',dt:'1958',ch:[
            {nm:'שחר'},{nm:'מיכל'},{nm:'סער'},
          ]},
          {nm:'יעקב (קובי)',dt:'1960',ch:[
            {nm:'דור'},{nm:'נוי'},{nm:'אורי'},
          ]},
          {nm:'עזרא',dt:'1965'},
        ]},
        {nm:'מוריס קזז',dt:'1934',ch:[
          {nm:'מוריס ⚭ שרה',ch:[{nm:'עופר עזרא',dt:'1962'}]},
          {nm:'מוריס ⚭ מרים',dt:'1935',ch:[{nm:'טלי',dt:'1967'},{nm:'רועי',dt:'1970'}]},
        ]},
        {nm:'אלי קזז ⚭ מיקי',dt:'1943',ch:[
          {nm:'אסנת',dt:'1967'},{nm:'ענת',dt:'1969'},{nm:'סימה',dt:'1973'},
        ]},
        {nm:'יחזקאל קזז ⚭ חנה',dt:'1929–1979'},
        {nm:'עבדולנבי לוי ⚭ כתון',dt:'1905–1990',ch:[
          {nm:'עדה ⚭ יאיר', dt:'עדה: 1946 • יאיר: 1947', ch:[
            {nm:'ליאור ⚭ ורד', ch:[
              {nm:'עדי'},{nm:'שי'},{nm:'ליהי'},
            ]},
            {nm:'מרב ⚭ יניב', ch:[
              {nm:'נבו'},{nm:'רומי'},
            ]},
            {nm:'נטע ⚭ אורן', ch:[
              {nm:'רז'},{nm:'עומר'},
            ]},
          ]},
          {nm:'שאול לוי ז"ל ⚭ דובה',dt:'שאול: 1948–1973 • דובה: 1947–',ch:[{nm:'יניב'},{nm:'תדהר',dt:'1971–2025'}]},
          {nm:'דליה ⚭ שאול מזור',dt:'דליה: 1951 • שאול: 1949',ch:[
            {nm:'לימור', ch:[
              {nm:'מיכאל'},
            ]},
            {nm:'אלעד ⚭ איריס', ch:[
              {nm:'לירון'},{nm:'עמית'},{nm:'רותם'},
            ]},
            {nm:'רועי ⚭ מיכל', ch:[
              {nm:'עידן'},{nm:'שירה'},{nm:'טל'},
            ]},
          ]},
          {nm:'חזי ⚭ רונית',dt:'חזי: 1956 • רונית: 1959',ch:[
            {nm:'תומר ⚭ רוני',dt:'תומר: 1982 • רוני: 1983',ch:[{nm:'איתן',dt:'2012'},{nm:'אמילי',dt:'2012'},{nm:'עופרי',dt:'2018'}]},
            {nm:'אלדד ⚭ אנה',dt:'אלדד: 1985 • אנה: 1988',ch:[{nm:'עמליה',dt:'2023'}]},
          ]},
        ]},
      ]},
      {nm:'סמרה'},{nm:"רג'ינה"},{nm:'מוזלי',dt:'נישאה לסלמאן'},
    ]},
    {nm:'סלמאן ⚭ מוזלי',dt:'מוזלי – בת יחזקאל וכתון',ch:[
      {nm:'כתון'},{nm:'חיים'},{nm:'דוד',dt:'1923'},
    ]},
    {nm:'עבדאללה'},{nm:'יצחק'},
    {nm:'מעתוקה'},{nm:'עזיזה'},{nm:"צ'חלה"},
  ]},
]};

const NW = 160, NH = 70, HGAP = 16, VGAP = 80;
const DCLS = ['d0','d1','d2','d3','d4','d5','d6','d7'];
function dc(d){ return DCLS[Math.min(d,7)]; }

function subtreeW(n) {
  if (!n._open || !n.ch || !n.ch.length) return NW;
  const total = n.ch.reduce((s,c) => s + subtreeW(c), 0) + HGAP * (n.ch.length - 1);
  return Math.max(NW, total);
}

function layout(n, x, y) {
  n._y = y; n._w = subtreeW(n); n._x = x + (n._w - NW) / 2;
  if (n._open && n.ch && n.ch.length) {
    let cx = x;
    for (const c of n.ch) {
      c._w = subtreeW(c);
      layout(c, cx, y + NH + VGAP);
      cx += c._w + HGAP;
    }
  }
}

function visible(n, arr=[]) {
  arr.push(n);
  if (n._open && n.ch) n.ch.forEach(c => visible(c, arr));
  return arr;
}

const ALL = [];
function gatherAll(n){ ALL.push(n); if(n.ch) n.ch.forEach(c=>gatherAll(c)); }
gatherAll(DATA);

ALL.forEach(n => { n._open = false; n._depth = 0; });
function setDepth(n,d){ n._depth=d; if(n.ch) n.ch.forEach(c=>setDepth(c,d+1)); }
setDepth(DATA,0);
DATA._open = true;

const canvas = document.getElementById('canvas');
const svgEl  = document.getElementById('lines');
const XPAD = 20;

function render() {
  layout(DATA, XPAD, 0);
  const nodes = visible(DATA);
  const maxX = Math.max(...nodes.map(n => n._x + NW)) + XPAD;
  const maxY = Math.max(...nodes.map(n => n._y + NH)) + 60;
  canvas.style.width  = maxX + 'px';
  canvas.style.height = maxY + 'px';
  svgEl.setAttribute('width', maxX);
  svgEl.setAttribute('height', maxY);

  nodes.forEach(n => {
    if (!n._el) {
      const el = document.createElement('div');
      el.className = 'card ' + dc(n._depth);
      const hasCh = n.ch && n.ch.length;
      el.innerHTML =
        '<div class="nm">' + n.nm.replace(/\n/g,'<br>') + '</div>' +
        (n.dt ? '<div class="dt">'+n.dt+'</div>' : '') +
        (hasCh ? '<div class="tog">▼</div>' : '');
      el.style.width = NW + 'px';
      if (n._open) el.classList.add('open');
      el.addEventListener('click', () => {
        if (!n.ch || !n.ch.length) return;
        const vpRect = vp.getBoundingClientRect();
        n._open = !n._open;
        render();
        requestAnimationFrame(() => {
          const newRect = el.getBoundingClientRect();
          vp.scrollLeft += (newRect.left + newRect.width/2) - vpRect.left - vpRect.width/2;
          vp.scrollTop  += (newRect.top  + newRect.height/2) - vpRect.top  - vpRect.height/2;
        });
      });
      n._el = el;
      canvas.appendChild(el);
    }
    n._el.style.left = n._x + 'px';
    n._el.style.top  = n._y + 'px';
    n._el.style.display = 'block';
    n._el.classList.toggle('open', n._open);
  });

  ALL.forEach(n => { if (n._el && !nodes.includes(n)) n._el.style.display = 'none'; });
  drawLines(nodes);
}

function drawLines(nodes) {
  const LC = '#5a9028';
  let p = '';
  nodes.forEach(n => {
    if (!n._open || !n.ch || !n.ch.length) return;
    const px = n._x + NW/2, py = n._y + NH, my = py + VGAP * 0.45;
    const vis = n.ch.filter(c => nodes.includes(c));
    if (!vis.length) return;
    p += `<line x1="${px}" y1="${py}" x2="${px}" y2="${my}" stroke="${LC}" stroke-width="3" stroke-linecap="round"/>`;
    if (vis.length === 1) {
      const k = vis[0], kx = k._x + NW/2;
      p += `<line x1="${px}" y1="${my}" x2="${kx}" y2="${my}" stroke="${LC}" stroke-width="3"/>`;
      p += `<line x1="${kx}" y1="${my}" x2="${kx}" y2="${k._y}" stroke="${LC}" stroke-width="3" stroke-linecap="round"/>`;
    } else {
      const xs = vis.map(k => k._x + NW/2);
      p += `<line x1="${Math.min(...xs)}" y1="${my}" x2="${Math.max(...xs)}" y2="${my}" stroke="${LC}" stroke-width="3"/>`;
      vis.forEach(k => {
        const kx = k._x + NW/2;
        p += `<line x1="${kx}" y1="${my}" x2="${kx}" y2="${k._y}" stroke="${LC}" stroke-width="3" stroke-linecap="round"/>`;
      });
    }
  });
  svgEl.innerHTML = p;
}

let scale = 1;
const vp = document.getElementById('vp');
render();
setTimeout(centerOnRoot, 60);

function doZoom(f) {
  scale = Math.min(3, Math.max(0.15, scale * f));
  canvas.style.transform = `scale(${scale})`;
  canvas.style.transformOrigin = 'top center';
}
function centerOnRoot() {
  if (!DATA._el) return;
  requestAnimationFrame(() => {
    const vpRect = vp.getBoundingClientRect();
    const elRect = DATA._el.getBoundingClientRect();
    vp.scrollLeft += elRect.left + elRect.width/2 - vpRect.left - vpRect.width/2;
  });
}
function resetView() {
  scale = 1;
  canvas.style.transform = '';
  ALL.forEach(n => { n._open = false; if (n._el) { n._el.remove(); n._el = null; } });
  DATA._open = true;
  render();
  setTimeout(centerOnRoot, 80);
}

let lastDist = 0;
vp.addEventListener('touchstart', e => {
  if (e.touches.length === 2)
    lastDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
}, {passive:true});
vp.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    doZoom(d / lastDist); lastDist = d;
  }
}, {passive:true});

function openPath(target) {
  function dig(n) {
    if (n === target) return true;
    if (!n.ch) return false;
    for (const c of n.ch) { if (dig(c)) { n._open = true; return true; } }
  }
  dig(DATA);
}
function doSearch(q) {
  ALL.forEach(n => n._el && n._el.classList.remove('hl'));
  if (!q.trim()) return;
  ALL.filter(n => n.nm.includes(q)||(n.dt||'').includes(q)).forEach(n => {
    openPath(n); render();
    setTimeout(() => { if (n._el) { n._el.classList.add('hl'); n._el.scrollIntoView({behavior:'smooth', block:'center'}); } }, 80);
  });
}
document.addEventListener('click', e => {
  if (!e.target.closest('#legbox') && !e.target.closest('#legbtn'))
    document.getElementById('legbox').classList.remove('show');
});
</script>
</body>
</html>
